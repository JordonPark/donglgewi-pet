name: Donglgewi TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Donglgewi's internal TestFlight after validating the archive
        type: boolean
        default: false
      code_push:
        description: Build a Shorebird release for TestFlight
        type: boolean
        default: true
      patch_release:
        description: Publish a patch to the exact internal release, for example 0.1.0+3
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: donglgewi-testflight

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Flutter 3.50.1
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Check Flutter code
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Set up Shorebird
        if: inputs.code_push || inputs.patch_release != ''
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Create Shorebird release and iOS archive
        if: inputs.code_push && inputs.patch_release == ''
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          test -n "$SHOREBIRD_TOKEN"
          shorebird release ios --flutter-version=3.50.0 --no-codesign --build-number="$GITHUB_RUN_NUMBER"
      - name: Build standard iOS archive
        if: ${{ !inputs.code_push && inputs.patch_release == '' }}
        run: flutter build ipa --release --no-codesign --no-pub --build-number="$GITHUB_RUN_NUMBER"
      - name: Verify archive identity
        if: inputs.patch_release == ''
        run: |
          archive="$PWD/build/ios/archive/Runner.xcarchive"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$archive/Info.plist")" = com.jordonpark.donglgewi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$archive/Products/Applications/Runner.app/Info.plist")" = 동글귀
      - name: Sign and upload the internal beta
        if: inputs.upload && inputs.patch_release == '' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ || ! "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ || -z "$ASC_ISSUER_ID" || -z "$ASC_PRIVATE_KEY" ]]; then
            echo '::error::Configure the Apple team and an App Store Connect signing key.'
            exit 1
          fi
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/donglgewi-sign.XXXXXX")
          key="$scratch/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          unset ASC_PRIVATE_KEY
          options="$scratch/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string upload "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          plutil -insert testFlightInternalTestingOnly -bool YES "$options"
          xcodebuild -exportArchive -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportPath "$scratch/export" -exportOptionsPlist "$options" \
            -allowProvisioningUpdates -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Publish patch to the TestFlight release
        if: inputs.patch_release != '' && github.ref == 'refs/heads/main'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE_VERSION: ${{ inputs.patch_release }}
        run: |
          test -n "$SHOREBIRD_TOKEN"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo '::error::Enter the exact TestFlight release version and build number.'
            exit 1
          fi
          shorebird patch ios --release-version="$RELEASE_VERSION" --track=stable --no-codesign \
            --build-name="${RELEASE_VERSION%%+*}" --build-number="${RELEASE_VERSION##*+}"
